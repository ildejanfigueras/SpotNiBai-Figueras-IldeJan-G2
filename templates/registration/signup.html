{% extends "base.html" %}
{% block title %}Sign up | SpotNiBai{% endblock %}
{% block content %}
<div class="card auth-card">
  <h2>Create your account</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary btn-block">Sign up</button>
  </form>
  <p class="auth-switch">Already registered? <a href="{% url 'accounts:login' %}">Log in</a></p>
</div>
{% endblock %}
