{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SpotNiBai{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="auth-page">
  <div class="auth-layout">

    <aside class="auth-aside">
      <span class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill-rule="evenodd" d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z M12 7.4a2.6 2.6 0 1 1 0 5.2 2.6 2.6 0 0 1 0-5.2z"/>
        </svg>
        SpotNiBai
      </span>

      <svg class="auth-route" viewBox="0 0 320 320" aria-hidden="true" focusable="false">
        <path class="route-line" d="M20 300 C80 300 90 230 150 220 S230 190 230 110"/>
        <circle class="route-start" cx="20" cy="300" r="6"/>
        <g class="route-pin">
          <path fill-rule="evenodd" transform="translate(230 110) scale(4) translate(-12 -22)" d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z M12 7.4a2.6 2.6 0 1 1 0 5.2 2.6 2.6 0 0 1 0-5.2z"/>
        </g>
      </svg>

      <p class="auth-tagline">Discover and share places around Cebu City.</p>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <span class="brand auth-brand-mobile">
          <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill-rule="evenodd" d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z M12 7.4a2.6 2.6 0 1 1 0 5.2 2.6 2.6 0 0 1 0-5.2z"/>
          </svg>
          SpotNiBai
        </span>

        {% if messages %}
          {% for message in messages %}
            <div class="alert {{ message.tags }}" role="alert">{{ message }}</div>
          {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
      </div>
    </main>

  </div>
</body>
</html>
