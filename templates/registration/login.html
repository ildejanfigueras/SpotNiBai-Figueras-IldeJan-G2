{% extends "base.html" %}
{% block title %}Log in | SpotNiBai{% endblock %}
{% block content %}
<div class="card auth-card">
  <h2>Log in</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>
  <p class="auth-switch">No account? <a href="{% url 'accounts:signup' %}">Sign up</a></p>
</div>
{% endblock %}
