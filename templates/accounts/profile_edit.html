{% extends "base.html" %}
{% block title %}Edit Profile | SpotNiBai{% endblock %}
{% block content %}
<div class="card auth-card">
  <h2>Edit profile</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save changes</button>
    <a class="btn btn-outline" href="{% url 'accounts:profile' %}">Cancel</a>
  </form>
</div>
{% endblock %}
